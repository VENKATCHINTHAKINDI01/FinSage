[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsage-ai"
version = "0.2.0"
description = "Tax optimisation and procurement intelligence for India"
authors = [{ name = "FinSage Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies live in requirements.txt, dev tooling in
# requirements-dev.txt. Keeping them there rather than duplicating here avoids
# the two lists drifting apart, which is how v1 ended up with celery, rq and
# python-jose installed and never imported.

[tool.setuptools]
packages = ["backend"]


# ── Formatting & linting ─────────────────────────────────────────────────────
# ruff replaces black entirely (ruff format). One tool, one config.

[tool.ruff]
line-length = 100
# py310, not py311, and the reason is worth recording. The project declares
# requires-python >= 3.11, but the test environment runs 3.10 — and a lint rule
# that rewrites `timezone.utc` into `datetime.UTC` breaks collection there, so
# the whole suite stops running to satisfy a style preference. A suite that
# cannot run is not checking anything. Raise this when the floor is genuinely
# 3.11 everywhere the tests execute.
target-version = "py310"
extend-exclude = ["senv", "frontend", "backend/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "C4",          # comprehensions
    "SIM",         # simplify
    "RUF",         # ruff-specific
    "ASYNC",       # async correctness — catches blocking calls in async defs
    "S",           # bandit security checks
]
ignore = [
    "E501",        # line length is handled by the formatter
    "B008",        # FastAPI Depends() in defaults is idiomatic
    # Prose and comments use typographic dashes deliberately, and the FY regex
    # must match the en dash because source documents and agents both emit it.
    "RUF001", "RUF002", "RUF003",
    # UP017 rewrites `timezone.utc` to `datetime.UTC`, which is 3.11+ only.
    # Its autofix has silently broken this build three times — the fan-out
    # timeout path, the WebSocket handler and the document vault — each time
    # only caught by a test that happened to exercise the exact line.
    # The gate is deliberately runnable on 3.10, so the rule is off.
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]            # assert is the point
"backend/evals/**" = ["S101"]
# `token_type="access"` is a discriminator, not a credential. S105/S106/S107
# key off the variable NAME containing "token", so every JWT claim name in the
# module trips them. Suppressed per-file with the reason rather than scattering
# noqa comments that would hide a real finding among fourteen false ones.
"backend/security/jwt_handler.py" = ["S105", "S106", "S107"]
"backend/security/dependencies.py" = ["S106"]
"backend/middleware/asgi_ratelimit.py" = ["S106"]
# "_TOKEN_BUCKET_LUA" trips S105 on the variable name alone — it is a Lua
# script constant, not a credential.
"backend/middleware/redis_ratelimit.py" = ["S105"]
# The PRD-005 suite is entirely about bad secrets, so it is full of them on
# purpose. A rule that flags a test for containing the string it exists to
# reject is measuring the wrong thing.
"backend/security/tests/**" = ["S101", "S105", "S106", "S107"]
# Same reason: the PRD-004 suite feeds fake secrets and fake PAN/Aadhaar values
# through the redactor on purpose. Flagging a test for containing the thing it
# exists to strip is measuring the wrong thing.
"backend/observability/tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]


# ── Type checking ────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["senv/", "backend/db/migrations/"]

# The core is held to a higher standard than the rest of the codebase: it
# produces every rupee figure in the product, so its types are load-bearing.
[[tool.mypy.overrides]]
module = "backend.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_equality = true


# ── Tests ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend/core/tests",   # layer 1 golden + layer 2 properties + purity
    "backend/evals/tests",  # layer 3 harness self-tests
    "backend/tests",        # legacy suite — rewritten across phases 1–3
]
markers = [
    "golden: verified input-to-exact-output tax case",
    "property: invariant that must hold for all inputs",
    "eval: agent evaluation scenario",
    "integration: requires Postgres/Redis/Qdrant",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]


[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/migrations/*", "senv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Phase 1 gate raises this to 95 for backend/core specifically (CORE-011).
# The repo-wide figure stays low until the legacy suite is rewritten — a high
# global number here would only be measuring untested code that happens to run.
fail_under = 0

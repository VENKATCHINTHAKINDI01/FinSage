# ═══════════════════════════════════════════════════════════════════════════
# Income-tax Act 1961 → Income-tax Act 2025 section mapping
#
# The 2025 Act came into force on 1 April 2026 and renumbered essentially
# everything: 819 sections across 23 chapters became 536. The policy is largely
# unchanged; the citations are entirely changed.
#
# This creates a two-audience problem. Departmental utilities and correspondence
# for FY 2026-27 use the new numbering. Users, CAs, every article written before
# 2026, and decades of habit use the old. So the product renders BOTH, and this
# file is what makes that possible.
#
# VERIFIED 2026-08-23 against the official CBDT concordance
# ----------------------------------------------------------
#   https://www.incometaxindia.gov.in/documents/20117/43138/
#       new-income-tax-bill-2025-navigator.pdf
#
# Every entry below was read from that document. A previous attempt used
# secondary sources (caclubindia, taxgarden) which CONTRADICTED each other and
# this file — one claimed 87A, 24(b) and 10(13A) were unchanged, another put
# 80G at 354. The navigator settles all three: 87A is 156, 24(b) sits inside
# 22, and 10(13A) is not a section at all. That is why the rule was to wait for
# the primary source rather than average the secondary ones.
#
# Three structural facts the navigator makes visible, which a flat
# old->new dictionary cannot express:
#
#   MERGES      44AD and 44ADA both become s.58; 288A and 288B both become
#               s.516. The mapping is not reversible, so rendering only the
#               2025 number loses which provision was applied.
#   SCHEDULES   10(13A) (HRA) is not a section in the 2025 Act — it moved to
#               Schedule III. Printing a section number for it is wrong.
#   OMISSIONS   The navigator records no 2025 counterpart for 80TTB. See the
#               entry, which does NOT infer that the deduction is gone.
# ═══════════════════════════════════════════════════════════════════════════

meta:
  verified_on: "2026-08-09"
  status: partial
  sources:
    - https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/objective-and-scope-new-act
    - https://www.pib.gov.in/PressReleasePage.aspx?PRID=2248005
  policy: >
    Where an entry is unverified the renderer shows the 1961 number as primary
    and marks the 2025 number as provisional. It never silently substitutes one
    for the other.

# Applies from FY 2026-27 onward. For earlier years the 1961 numbering is
# primary and no translation is applied.
applies_from_fy: "2026-27"


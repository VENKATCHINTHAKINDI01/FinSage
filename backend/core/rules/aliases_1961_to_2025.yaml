# ═══════════════════════════════════════════════════════════════════════════
# Income-tax Act 1961 → Income-tax Act 2025 section mapping
#
# The 2025 Act came into force on 1 April 2026 and renumbered essentially
# everything: 819 sections across 23 chapters became 536. The policy is largely
# unchanged; the citations are entirely changed.
#
# This creates a two-audience problem. Departmental utilities and correspondence
# for FY 2026-27 use the new numbering. Users, CAs, every article written before
# 2026, and decades of habit use the old. So the product renders BOTH, and this
# file is what makes that possible.
#
# HONESTY NOTE
# ------------
# Entries marked `confidence: unverified` are the obvious structural
# correspondence but have NOT yet been checked line by line against the
# published concordance. They render with the legacy number as primary and the
# new number flagged. Guessing a citation confidently is exactly the failure
# mode this project exists to avoid — see CORE-002 in feature.json, which stays
# `not_started` until every entry is verified.
#
# Verify against:
#   https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/objective-and-scope-new-act
#   https://www.incometaxindia.gov.in/  (Interplay and Transition FAQs)
# ═══════════════════════════════════════════════════════════════════════════

meta:
  verified_on: "2026-08-09"
  status: partial
  sources:
    - https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/objective-and-scope-new-act
    - https://www.pib.gov.in/PressReleasePage.aspx?PRID=2248005
  policy: >
    Where an entry is unverified the renderer shows the 1961 number as primary
    and marks the 2025 number as provisional. It never silently substitutes one
    for the other.

# Applies from FY 2026-27 onward. For earlier years the 1961 numbering is
# primary and no translation is applied.
applies_from_fy: "2026-27"


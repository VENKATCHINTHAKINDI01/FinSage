  - legacy: "80TTB"
    current: "OMITTED"
    description: See the note below — the navigator records no 2025 counterpart
    confidence: verified
    # The navigator lists NO 2025 counterpart for 80TTB, while
    # 80TTA maps to s.153 "Deduction for Interest on Deposits".
    # The likely reading is that the two merged into s.153 with the
    # senior-citizen limb inside it, but the navigator does not say
    # so and this system has not read s.153 of the 2025 Act. The
    # deduction is therefore still modelled under its 1961 number
    # and its rule is unchanged; what is recorded here is what the
    # official document actually says, not an inference from it.
    needs_human_check: >
      Read s.153 of the Income-tax Act 2025 and confirm whether the
      senior-citizen deposit-interest deduction survives inside it.
      If it does not, backend/core/rules/fy_2026_27.yaml and
      backend/core/eligibility/rules.yaml both need changing.

